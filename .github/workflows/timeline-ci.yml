name: Timeline CI

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/timeline-ci.yml"
      - "packages/timeline/**"
      - "packages/mcp-service/**"
      - "packages/user-mcp-service/**"
      - "docs/**"
      - "scripts/**"
      - "rspress.config.ts"
      - "vite.config.ts"
      - "tsconfig.docs.json"
  push:
    branches:
      - main
      - master
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/timeline-ci.yml"
      - "packages/timeline/**"
      - "packages/mcp-service/**"
      - "packages/user-mcp-service/**"
      - "docs/**"
      - "scripts/**"
      - "rspress.config.ts"
      - "vite.config.ts"
      - "tsconfig.docs.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build

      - name: Verify MCP package
        run: pnpm -C packages/mcp-service test:package

      - name: Verify user MCP package
        run: pnpm -C packages/user-mcp-service test:package
